<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Student Instagram Hub</title>
<style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #667085;
      --border: #e5e7eb;
      --accent: #7c3aed;
      --accent-2: #ec4899;
      --accent-soft: #f3e8ff;
      --shadow: 0 18px 50px rgba(17, 24, 39, 0.10);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(124, 58, 237, 0.10), transparent 30rem),
        radial-gradient(circle at 90% 10%, rgba(236, 72, 153, 0.09), transparent 28rem),
        var(--bg);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 22px 18px 48px;
    }

    /* ---------- Header ---------- */

    .header {
      text-align: center;
      padding: 22px 10px 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-2);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      max-width: 560px;
      margin: 12px auto 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.98rem;
    }

    /* ---------- Account navigation ---------- */

    .account-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      padding: 6px 2px 14px;
      scrollbar-width: thin;
      scrollbar-color: #d1d5db transparent;
    }

    .account-nav::-webkit-scrollbar {
      height: 6px;
    }

    .account-nav::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 999px;
    }

    .account-tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.88);
      color: #475467;
      padding: 11px 15px;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 750;
      cursor: pointer;
      transition:
        transform 180ms ease,
        background 180ms ease,
        color 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .account-tab:hover {
      transform: translateY(-1px);
      border-color: #c4b5fd;
    }

    .account-tab:focus-visible {
      outline: 3px solid rgba(124, 58, 237, 0.25);
      outline-offset: 2px;
    }

    .account-tab.active {
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.22);
    }

    /* ---------- Main QR card ---------- */

    .card {
      position: relative;
      overflow: hidden;
      margin-top: 10px;
      padding: clamp(22px, 5vw, 42px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -120px;
      top: -120px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.06);
      pointer-events: none;
    }

    .account-label {
      margin: 0 0 22px;
      font-size: clamp(1.45rem, 4vw, 2rem);
      letter-spacing: -0.025em;
    }

    .qr-stage {
      width: min(82vw, 370px);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 20px);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 10px 30px rgba(17, 24, 39, 0.07),
        inset 0 0 0 1px rgba(17, 24, 39, 0.02);
    }

    #qrImage {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      border-radius: 2px;
    }

    .description {
      margin: 22px auto 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .visit-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 16px;
      padding: 11px 16px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      text-decoration: none;
      font-weight: 800;
      transition: transform 180ms ease, background 180ms ease;
    }

    .visit-link:hover {
      transform: translateY(-1px);
      background: #ede9fe;
    }

    .visit-link:focus-visible {
      outline: 3px solid rgba(124, 58, 237, 0.25);
      outline-offset: 2px;
    }

    .switching {
      animation: cardIn 280ms ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0.35;
        transform: translateY(7px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .footer-note {
      margin: 18px 0 0;
      color: #98a2b3;
      text-align: center;
      font-size: 0.8rem;
    }

    /* ---------- Small screens ---------- */

    @media (max-width: 600px) {
      .page {
        padding: 12px 12px 32px;
      }

      .header {
        padding-top: 16px;
      }

      .subtitle {
        font-size: 0.92rem;
      }

      .card {
        border-radius: 20px;
      }

      .account-tab {
        padding: 10px 13px;
        font-size: 0.84rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <p class="eyebrow">
        <span class="eyebrow-dot" aria-hidden="true"></span>
        Student Instagram Hub
      </p>
      <h1>Find your Instagram page</h1>
      <p class="subtitle">
        Choose an account below, then scan its QR code to visit the page.
      </p>
    </header>

    <!-- The five account buttons are generated automatically from the
         ACCOUNTS array in the JavaScript below. -->
    <nav
      id="accountNav"
      class="account-nav"
      aria-label="Instagram accounts">
    </nav>

    <section id="accountCard" class="card" aria-live="polite">
      <h2 id="accountLabel" class="account-label">@NEXORA.VIDEOGRAPHY2K26</h2>

      <div class="qr-stage" aria-label="QR code area">
        <img
          id="qrImage"
          src=""
          alt="Instagram QR code"
          width="330"
          height="330" />
      </div>

      <p class="description">
        Scan the QR code to visit this Instagram page.
      </p>

      <a
        id="visitLink"
        class="visit-link"
        href="https://instagram.com/NEXORA.VIDEOGRAPHY2K26"
        target="_blank"
        rel="noopener noreferrer">
        Open Instagram ↗
      </a>
    </section>

    <p class="footer-note">
      Tip: On a phone, swipe the account menu sideways to see all accounts.
    </p>
  </main>

      }
    ];

    let selectedIndex = 0;

    const accountNav = document.getElementById("accountNav");
    const accountCard = document.getElementById("accountCard");
    const accountLabel = document.getElementById("accountLabel");
    const qrImage = document.getElementById("qrImage");
    const visitLink = document.getElementById("visitLink");

    function renderNavigation() {
      accountNav.innerHTML = "";

      ACCOUNTS.forEach((account, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "account-tab";
        button.textContent = account.username;
        button.setAttribute("aria-label", `Show ${account.username}`);
        button.setAttribute("aria-selected", String(index === selectedIndex));

        if (index === selectedIndex) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => selectAccount(index));
        accountNav.appendChild(button);
      });
    }

    function showQRCode(account) {
      qrImage.src = account.qr;
      qrImage.alt = `Instagram QR code for ${account.username}`;
    }

    function updateActiveTab() {
      [...accountNav.children].forEach((button, index) => {
        const isActive = index === selectedIndex;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
    }

    function selectAccount(index) {
      if (!ACCOUNTS[index]) return;

      selectedIndex = index;
      const account = ACCOUNTS[index];

      accountLabel.textContent = account.username;
      visitLink.href = account.url;

      updateActiveTab();
      showQRCode(account);

      // Replay a subtle transition when switching accounts.
      accountCard.classList.remove("switching");
      void accountCard.offsetWidth;
      accountCard.classList.add("switching");
    }

    // Render the first account after the page loads.
    window.addEventListener("load", () => {
      renderNavigation();
      selectAccount(0);
    });
  </script>
